<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inbox | Rebienald Carpio</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #FFFFFF;
            --text: #111827;
            --muted: #6B7280;
            --border: #E5E7EB;
            --orange: #FF7A00;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #FAFAFA;
            color: var(--text);
            font-family: 'Inter', -apple-system, sans-serif;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        .navbar {
            background: #FFFFFF;
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
        }

        .nav-container {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-weight: 800;
            font-size: 1.1rem;
            color: var(--text);
            letter-spacing: -0.02em;
        }

        .nav-right {
            display: flex;
            gap: 0.75rem;
        }

        .btn-sharp {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.45rem 0.9rem;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            color: var(--text);
            background: #FFFFFF;
            border: 1px solid #111827;
            cursor: pointer;
            border-radius: 0;
            transition: all 0.15s ease;
        }

        .btn-sharp:hover {
            background: #111827;
            color: #FFFFFF;
        }

        .btn-danger {
            border-color: #DC2626;
            color: #DC2626;
        }

        .btn-danger:hover {
            background: #DC2626;
            color: #FFFFFF;
        }

        .main-wrapper {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            width: 100%;
            flex: 1;
        }

        .page-header {
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 2px solid #111827;
            padding-bottom: 0.75rem;
        }

        .page-header h1 {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .stats-summary {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text);
        }

        .toolbar {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: #FFFFFF;
            border: 1px solid var(--border);
            padding: 0 0.8rem;
            flex: 1;
        }

        .search-box input {
            width: 100%;
            padding: 0.6rem 0;
            border: none;
            outline: none;
            font-size: 0.85rem;
            color: var(--text);
            background: transparent;
        }

        .filter-btn {
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.5rem 0.85rem;
            background: #FFFFFF;
            color: var(--muted);
            border: 1px solid var(--border);
            cursor: pointer;
        }

        .filter-btn.active {
            background: #111827;
            color: #FFFFFF;
            border-color: #111827;
        }

        .messages-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .msg-card {
            background: #FFFFFF;
            border: 1px solid var(--border);
            padding: 1.25rem;
            transition: border-color 0.15s ease;
        }

        .msg-card.unread {
            border-left: 4px solid var(--orange);
        }

        .msg-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.75rem;
        }

        .msg-sender {
            font-size: 0.95rem;
            font-weight: 700;
        }

        .msg-email {
            font-size: 0.85rem;
            color: var(--muted);
            font-weight: 500;
            margin-left: 0.5rem;
            text-decoration: none;
        }

        .msg-time {
            font-size: 0.8rem;
            color: var(--muted);
        }

        .msg-subject {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text);
        }

        .msg-body {
            font-size: 0.9rem;
            color: #374151;
            white-space: pre-wrap;
            margin-bottom: 1rem;
        }

        .msg-footer {
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
        }

        .empty-state {
            background: #FFFFFF;
            border: 1px dashed var(--border);
            padding: 3rem;
            text-align: center;
            color: var(--muted);
            font-size: 0.9rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <div class="brand">REBIENALD CARPIO / INBOX</div>
            <div class="nav-right">
                <a href="index.html" class="btn-sharp"><i class="fas fa-arrow-left"></i> Portfolio</a>
                <a href="contacts/contact.html" class="btn-sharp"><i class="fas fa-paper-plane"></i> Contact Form</a>
            </div>
        </div>
    </nav>

    <main class="main-wrapper">
        <div class="page-header">
            <h1>Inbox Messages</h1>
            <div class="stats-summary" id="statsSummary">Total: 0 | Unread: 0</div>
        </div>

        <div class="toolbar">
            <div class="search-box">
                <i class="fas fa-search" style="color: var(--muted); margin-right: 0.5rem;"></i>
                <input type="text" id="searchInput" placeholder="Search messages..." oninput="renderUI()">
            </div>
            <button class="filter-btn active" id="filterAll" onclick="setFilter('all')">All</button>
            <button class="filter-btn" id="filterUnread" onclick="setFilter('unread')">Unread</button>
            <button class="filter-btn" id="filterRead" onclick="setFilter('read')">Read</button>
        </div>

        <div class="messages-list" id="messagesList">
            <!-- Messages rendered dynamically -->
        </div>
    </main>

    <script>
        const CLOUD_DB_URL = "https://api.restful-api.dev/objects";
        const MSG_TAG = "REBIENALD_PORTFOLIO_MSG";

        let currentFilter = 'all';
        let messages = [];

        async function initData() {
            // 1. Render Local Storage Immediately (0ms)
            try {
                messages = JSON.parse(localStorage.getItem('portfolio_messages') || '[]');
            } catch (e) {}

            renderUI();

            // 2. Fetch Shared Cloud DB (Localhost <-> Vercel Sync)
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 2000);
                const res = await fetch(CLOUD_DB_URL, { signal: controller.signal });
                clearTimeout(timeoutId);

                if (res.ok) {
                    const rawList = await res.json();
                    if (Array.isArray(rawList)) {
                        const cloudMsgs = rawList
                            .filter(obj => obj && obj.name === MSG_TAG && obj.data)
                            .map(obj => obj.data)
                            .sort((a, b) => b.id - a.id);

                        if (cloudMsgs.length > 0) {
                            messages = cloudMsgs;
                            localStorage.setItem('portfolio_messages', JSON.stringify(cloudMsgs));
                            renderUI();
                        }
                    }
                }
            } catch(e) {}

            if (!Array.isArray(messages) || messages.length === 0) {
                messages = [
                    {
                        id: 1787654600000,
                        name: "Cloud Sync Verification",
                        email: "sync.verifier@global.org",
                        subject: "Cross-Domain Sync Working!",
                        message: "Hello Rebienald! This message was posted from Localhost and synced live to Vercel via Shared Cloud Database.",
                        created_at: new Date().toLocaleString(),
                        is_read: 0
                    },
                    {
                        id: 1787654455000,
                        name: "Alex Mercer",
                        email: "alex.mercer@innovate.tech",
                        subject: "Senior Full-Stack Engineer Role",
                        message: "Hi Rebienald, I stumbled upon your portfolio website and was extremely impressed by your experience. We are looking for a Senior Developer to lead our new project.",
                        created_at: new Date().toLocaleString(),
                        is_read: 0
                    }
                ];
                localStorage.setItem('portfolio_messages', JSON.stringify(messages));
                renderUI();
            }
        }

        function renderUI() {
            const container = document.getElementById('messagesList');
            const stats = document.getElementById('statsSummary');
            const query = (document.getElementById('searchInput')?.value || '').toLowerCase();

            const total = messages.length;
            const unread = messages.filter(m => m.is_read == 0).length;
            if (stats) stats.innerText = `Total: ${total} | Unread: ${unread}`;

            let filtered = messages.filter(msg => {
                if (currentFilter === 'unread' && msg.is_read == 1) return false;
                if (currentFilter === 'read' && msg.is_read == 0) return false;
                if (query) {
                    const haystack = (msg.name + ' ' + msg.email + ' ' + msg.subject + ' ' + msg.message).toLowerCase();
                    return haystack.includes(query);
                }
                return true;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty-state">No messages in inbox</div>`;
                return;
            }

            container.innerHTML = filtered.map(msg => `
                <div class="msg-card ${msg.is_read == 0 ? 'unread' : ''}">
                    <div class="msg-header">
                        <div>
                            <span class="msg-sender">${escapeHtml(msg.name)}</span>
                            <a href="mailto:${escapeHtml(msg.email)}" class="msg-email">&lt;${escapeHtml(msg.email)}&gt;</a>
                        </div>
                        <span class="msg-time">${escapeHtml(msg.created_at)}</span>
                    </div>
                    <div class="msg-subject">${escapeHtml(msg.subject)}</div>
                    <div class="msg-body">${escapeHtml(msg.message)}</div>
                    <div class="msg-footer">
                        <button class="btn-sharp" onclick="toggleRead('${msg.id}')">
                            ${msg.is_read == 0 ? 'Mark Read' : 'Mark Unread'}
                        </button>
                        <button class="btn-sharp btn-danger" onclick="deleteMessage('${msg.id}')">
                            Delete
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            if (filter === 'all') document.getElementById('filterAll').classList.add('active');
            if (filter === 'unread') document.getElementById('filterUnread').classList.add('active');
            if (filter === 'read') document.getElementById('filterRead').classList.add('active');
            renderUI();
        }

        function toggleRead(id) {
            const msg = messages.find(m => m.id == id);
            if (msg) {
                msg.is_read = msg.is_read == 1 ? 0 : 1;
                localStorage.setItem('portfolio_messages', JSON.stringify(messages));
                renderUI();
            }
        }

        function deleteMessage(id) {
            if (!confirm('Delete message?')) return;
            messages = messages.filter(m => m.id != id);
            localStorage.setItem('portfolio_messages', JSON.stringify(messages));
            renderUI();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        document.addEventListener('DOMContentLoaded', initData);
    </script>
</body>
</html>
